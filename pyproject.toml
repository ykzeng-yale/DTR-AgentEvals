[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtr-agent-evals"
version = "0.1.0"
description = "Reproducible longitudinal model-routing evaluation experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "jinja2>=3.1,<4"]
plot = ["matplotlib>=3.8,<4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
